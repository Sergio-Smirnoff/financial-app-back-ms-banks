spring:
  datasource:
    url: jdbc:h2:mem:banks;MODE=PostgreSQL;DATABASE_TO_UPPER=false;INIT=CREATE SCHEMA IF NOT EXISTS banks
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: BANKS
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
