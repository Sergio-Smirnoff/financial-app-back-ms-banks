server:
  port: 8083
  forward-headers-strategy: framework

spring:
  application:
    name: banks-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financialapp?currentSchema=banks}
    username: ${DB_USERNAME:financialapp}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: banks
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    schemas: banks
    default-schema: banks
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: banks-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.financialapp.*"
        spring.json.type.mapping: "com.financialapp.finances.kafka.event.TransactionCreatedEvent:com.financialapp.banks.infrastructure.messaging.payload.TransactionCreatedEvent"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

finances:
  service:
    url: ${FINANCES_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
